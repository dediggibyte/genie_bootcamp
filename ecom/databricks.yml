# =================================================================================================
# ecom bootcamp - Declarative Automation Bundle (formerly Databricks Asset Bundle)
#
# Deploys the Nordvik Group lakehouse: three domains, one serverless pipeline each, and one job:
#   * pipelines ecom_retail_pipeline, ecom_mobility_pipeline, ecom_telecom_pipeline
#       Lakeflow Spark Declarative Pipelines, CSV volume -> bronze -> silver -> gold (one star schema
#       per domain, at most 6 foreign keys each, so the first update registers all keys)
#   * job ecom_job - runs the three pipelines in parallel, then creates the metric views, applies the
#       ecom_* tags and validates the result
#
# Participants (workspace UI, from the Git folder):
#   open ecom/databricks.yml -> Deployments (rocket icon) -> target "dev" -> Deploy -> run "ecom_job".
# CLI (from this folder):
#   databricks bundle deploy -t dev            # optionally: --var catalog=<your_catalog>
#   databricks bundle run ecom_job -t dev
#
# Before deploying, run notebooks/2026-10-27-01-setup-catalog.py (creates the catalog, schemas, volume
# and copies the CSV files). The catalog default below matches the setup notebook's default.
# Re-running the job is safe: the pipelines only pick up new files, the metric views / tags tasks only
# apply what is missing or changed.
# =================================================================================================
bundle:
  name: ecom_bootcamp

include:
  - resources/*.yml

variables:
  catalog:
    description: >-
      Unity Catalog catalog for all ecom objects. Default ecom_<your short user name>, e.g.
      ecom_jane_doe for jane.doe@example.com (same rule as notebooks/2026-10-27-01-setup-catalog.py).
    default: ecom_${workspace.current_user.short_name}

workspace:
  # One deployment per catalog, so deployments into different catalogs never share state.
  root_path: ~/.bundle/${bundle.name}/${bundle.target}/${var.catalog}

sync:
  exclude:
    - data/**/*.csv   # copied into the volume from the Git folder by the setup notebook
                      # (data/2026-10-27-manifest.json IS deployed: the validate task compares row counts with it)
    - tools/**        # the data generator runs locally only

targets:
  dev:
    default: true
    mode: development
