# Lakeflow Spark Declarative Pipeline: CSV landing volume -> bronze -> silver -> gold (industry model).
# The SQL files are generated by bootcamp_domain/tools/build_domain_samples.py (repository root).
resources:
  pipelines:
    cpg_consumer_pipeline:
      name: cpg_consumer_pipeline (${var.catalog})
      catalog: ${var.catalog}
      schema: bronze            # default schema; every dataset uses a fully qualified name
      serverless: true
      channel: CURRENT
      continuous: false
      configuration:
        catalog: ${var.catalog} # referenced as ${catalog} in 02_pipeline/**/*.sql
      libraries:
        - file: { path: ../02_pipeline/consumer/01_bronze.sql }
        - file: { path: ../02_pipeline/consumer/02_silver.sql }
        - file: { path: ../02_pipeline/consumer/03_gold.sql }
        - file: { path: ../02_pipeline/finance/01_bronze.sql }
        - file: { path: ../02_pipeline/finance/02_silver.sql }
        - file: { path: ../02_pipeline/finance/03_gold.sql }
