# =================================================================================================
# Genie domain sample "Manufacturing" - Declarative Automation Bundle (formerly Databricks Asset Bundle)
#
# Deploys the Fjallmark manufacturing lakehouse of this sample: the `manufacturing` domain of the Lakehouse Industry Data
# Model plus the finance reference tables it needs:
#   * pipeline cpg_manufacturing_pipeline  - Lakeflow Spark Declarative Pipeline, bronze -> silver -> gold
#   * job      cpg_manufacturing_job       - runs the pipeline, then creates the metric views and applies the
#                                  model tags (in parallel), then validates the result
#
# Workspace UI (from the Git folder):
#   open bootcamp_domain/manufacturing/databricks.yml -> Deployments (rocket icon) -> target "dev" -> Deploy ->
#   run "cpg_manufacturing_job".
# CLI (from this folder):
#   databricks bundle deploy -t dev            # optionally: --var catalog=<your_catalog>
#   databricks bundle run cpg_manufacturing_job -t dev
#
# Before deploying, run notebooks/01_setup_catalog.py from the Git folder (creates the catalog, schemas,
# volume and copies the CSV files from ../../bootcamp/data). The catalog default below matches the setup
# notebook's default. Re-running the job is safe: the pipeline only picks up new files, the metric views
# / tags tasks only apply what is missing or changed.
# =================================================================================================
bundle:
  name: genie_domain_manufacturing

include:
  - resources/*.yml

variables:
  catalog:
    description: >-
      Unity Catalog catalog for all objects of this sample. Default cpg_manufacturing_<your short user name>,
      e.g. cpg_manufacturing_jane_doe for jane.doe@example.com (same rule as notebooks/01_setup_catalog.py).
    default: cpg_manufacturing_${workspace.current_user.short_name}

workspace:
  # One deployment per catalog, so deployments into different catalogs never share state.
  root_path: ~/.bundle/${bundle.name}/${bundle.target}/${var.catalog}

sync:
  exclude:
    - app/**          # deployed as a Databricks App by notebooks/06_router_app.py, not by the bundle

targets:
  dev:
    default: true
    mode: development
