[project]
name = "fjallmark-router-app"
version = "0.1.0"
description = "Fjällmark Finance router agent: one chat entry point for the Finance Analyst Genie Agent of the finance domain sample, with the Finance glossary as a tool (OpenAI Agents SDK, short-term memory and long-running tasks in Lakebase)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "mlflow>=3.10.1",
    "openai-agents>=0.4.1",
    "python-dotenv>=1.2.1",
    "uuid-utils>=0.10.0",
    "databricks-openai[memory]>=0.15.0",
    "databricks-sdk>=0.79.0",
    "databricks-agents>=1.9.3",
    "databricks-ai-bridge[agent-server]>=0.19.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]

[tool.uv]
# Dependency cooldown: skip package versions published in the last 7 days (uv >= 0.9.17)
exclude-newer = "7 days"

[project.scripts]
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
