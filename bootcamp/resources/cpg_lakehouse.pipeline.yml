# Lakeflow Spark Declarative Pipeline: CSV landing volume -> bronze -> silver -> gold (industry model).
# The SQL files are generated by tools/generate_lakehouse.py (repository root) from the industry model.
resources:
  pipelines:
    cpg_lakehouse_pipeline:
      name: cpg_lakehouse_pipeline (${var.catalog})
      catalog: ${var.catalog}
      schema: bronze            # default schema; every dataset uses a fully qualified name
      serverless: true
      channel: CURRENT
      continuous: false
      configuration:
        catalog: ${var.catalog} # referenced as ${catalog} in pipeline/**/*.sql
      libraries:
        - file: { path: ../pipeline/consumer/01_bronze.sql }
        - file: { path: ../pipeline/consumer/02_silver.sql }
        - file: { path: ../pipeline/consumer/03_gold.sql }
        - file: { path: ../pipeline/finance/01_bronze.sql }
        - file: { path: ../pipeline/finance/02_silver.sql }
        - file: { path: ../pipeline/finance/03_gold.sql }
        - file: { path: ../pipeline/manufacturing/01_bronze.sql }
        - file: { path: ../pipeline/manufacturing/02_silver.sql }
        - file: { path: ../pipeline/manufacturing/03_gold.sql }
