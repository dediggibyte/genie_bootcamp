# Fjällmark router app - one chat entry point for the three domain Genie Agents of the bootcamp.
# Created and deployed by notebooks/06_router_app.py, which binds these resources (and grants the app's service
# principal SELECT on the gold schemas plus a row-filter mapping):
#   genie-consumer / genie-finance / genie-manufacturing  the participant's three Genie Agents (CAN_RUN)
#   sql-warehouse                                        the agents' SQL warehouse (CAN_USE)
#   llm-endpoint                                         the router's model (CAN_QUERY)
#   experiment                                           MLflow experiment for the traces (CAN_EDIT)
#   postgres                                             databricks_postgres of the participant's branch of the bootcamp Lakebase project
command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: LAKEBASE_AUTOSCALING_ENDPOINT
    valueFrom: "postgres"
  - name: LAKEBASE_AGENT_MEMORY_SCHEMA
    value: "agent_memory"
  - name: LLM_ENDPOINT
    valueFrom: "llm-endpoint"
  - name: GENIE_SPACE_CONSUMER
    valueFrom: "genie-consumer"
  - name: GENIE_SPACE_FINANCE
    valueFrom: "genie-finance"
  - name: GENIE_SPACE_MANUFACTURING
    valueFrom: "genie-manufacturing"
  - name: LOG_LEVEL
    value: "INFO"
