# Lakeflow Spark Declarative Pipeline: CSV landing volume -> bronze -> silver -> gold, all 10 domains.
# The SQL files are generated by tools/generate_lakehouse.py (repository root) from the industry model.
resources:
  pipelines:
    cpg_lakehouse_pipeline:
      name: cpg_lakehouse_pipeline (${var.catalog})
      catalog: ${var.catalog}
      schema: bronze            # default schema; every dataset uses a fully qualified name
      serverless: true
      channel: CURRENT
      continuous: false
      configuration:
        catalog: ${var.catalog} # referenced as ${catalog} in src/pipeline/**/*.sql
      libraries:
        - file: { path: ../src/pipeline/consumer/01_bronze.sql }
        - file: { path: ../src/pipeline/consumer/02_silver.sql }
        - file: { path: ../src/pipeline/consumer/03_gold.sql }
        - file: { path: ../src/pipeline/distribution/01_bronze.sql }
        - file: { path: ../src/pipeline/distribution/02_silver.sql }
        - file: { path: ../src/pipeline/distribution/03_gold.sql }
        - file: { path: ../src/pipeline/finance/01_bronze.sql }
        - file: { path: ../src/pipeline/finance/02_silver.sql }
        - file: { path: ../src/pipeline/finance/03_gold.sql }
        - file: { path: ../src/pipeline/manufacturing/01_bronze.sql }
        - file: { path: ../src/pipeline/manufacturing/02_silver.sql }
        - file: { path: ../src/pipeline/manufacturing/03_gold.sql }
        - file: { path: ../src/pipeline/procurement/01_bronze.sql }
        - file: { path: ../src/pipeline/procurement/02_silver.sql }
        - file: { path: ../src/pipeline/procurement/03_gold.sql }
        - file: { path: ../src/pipeline/product/01_bronze.sql }
        - file: { path: ../src/pipeline/product/02_silver.sql }
        - file: { path: ../src/pipeline/product/03_gold.sql }
        - file: { path: ../src/pipeline/promotion/01_bronze.sql }
        - file: { path: ../src/pipeline/promotion/02_silver.sql }
        - file: { path: ../src/pipeline/promotion/03_gold.sql }
        - file: { path: ../src/pipeline/quality/01_bronze.sql }
        - file: { path: ../src/pipeline/quality/02_silver.sql }
        - file: { path: ../src/pipeline/quality/03_gold.sql }
        - file: { path: ../src/pipeline/sales/01_bronze.sql }
        - file: { path: ../src/pipeline/sales/02_silver.sql }
        - file: { path: ../src/pipeline/sales/03_gold.sql }
        - file: { path: ../src/pipeline/supply/01_bronze.sql }
        - file: { path: ../src/pipeline/supply/02_silver.sql }
        - file: { path: ../src/pipeline/supply/03_gold.sql }
